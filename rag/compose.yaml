name: rag

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rag-db-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 3s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.31.1
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - rag-ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 5s
      retries: 20

  mcp:
    build: .
    environment:
      RAG_DATABASE_URL: postgresql://rag:rag@db:5432/rag
      OLLAMA_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  rag-db-data:
  rag-ollama-models:
